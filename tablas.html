<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Tablas</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <main>
            <h1>Tablas en HTML</h1>
            <!--los borde no se debería utilizar-->
            <table border="1">
                <!--cabeceras-->
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>Ciudad</th>
                    </tr>                
                </thead>
                <tbody>
                    <!--filas-->
                    <tr>
                        <td>Juan</td>
                        <td>25</td>
                        <td>Madrid</td>
                    </tr>
                    <tr>
                        <td>María</td>
                        <td>30</td>
                        <td>Barcelona</td>
                    </tr>
                    <tr>
                        <td>Carlos</td>
                        <td>28</td>
                        <td>Valencia</td>
                    </tr>
                <tbody>
            </table>
        </main>
    </body>
</html>
